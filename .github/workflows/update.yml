name: Update README

on:
  schedule:
    - cron: "0 0 * * *"  # Daily at midnight UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Generate Snake animation graph with pinned release
      - name: Generate snake animation
        uses: Platane/snk@v3.1
        with:
          github_user_name: omarAmira
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Generate GitHub stats (alternative to unmaintained productive-box)
      - name: Generate GitHub Stats
        uses: jstrieb/github-stats@master
        with:
          user: omarAmira
          repository: omarAmira

      # Push generated files
      - name: Push generated files
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          mkdir -p output
          cp -r dist/*.svg output/ 2>/dev/null || true
          
          git add output/
          git commit -m "⚡ Update contribution graphs" || echo "No changes to commit"
          git push
