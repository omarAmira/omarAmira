name: Update README

on:
  schedule:
    - cron: "0 0 * * *"  # Daily at midnight UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Generate Snake animation graph
      - name: Generate snake animation
        uses: Platane/snk@master
        with:
          github_user_name: omarAmira
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Generate Pac-Man contribution graph
      - name: Generate Pac-Man graph
        uses: maxam2017/productive-box@master
        with:
          commit_message: Update productive time
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Push generated files to output branch
      - name: Push to output branch
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Copy generated SVGs to output directory
          mkdir -p output
          cp -r dist/*.svg output/ 2>/dev/null || true
          
          git add output/
          git commit -m "⚡ Update contribution graphs" || echo "No changes to commit"
          git push

      # Keep main branch updated with generated content
      - name: Commit changes to main
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "📊 Update README stats" && git push)
